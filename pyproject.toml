[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "biofilm-embeddings"
version = "0.1.0"
description = "biofilm-embeddings: biofilm image processing + DINOv2 ViT embedding extraction with a PySide6 GUI"
authors = [
  { name="Seh Na S. Mellick" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.10"
dependencies = [
    # Pinned (==) on purpose, not >=: the processing engine is vendored as a git
    # submodule at external/biofilm-processing (tag v1.0.1) and installed editable
    # from there. Pinning prevents silent version-drift in the render, which would
    # reintroduce batch effects in the DINOv2 embeddings. Bump deliberately:
    # advance the submodule to a new tag, then bump this pin in the same commit.
    # v1.0.1 differs from the paper-locked v1.0.0 ONLY in licensing (Apache 2.0 +
    # NOTICE) and package metadata -- `git diff v1.0.0 v1.0.1` touches no file under
    # src/, so the render is unchanged and embeddings made under either are
    # directly comparable.
    "biofilm-processing==1.0.1",
    "numpy",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "opencv-python",
    "pandas",
    "matplotlib",
    "tifffile",
    "imageio",
    "imageio-ffmpeg",
    "tqdm",
    "PySide6",
    # torch>=2.7 — first stable release with Blackwell sm_120 SASS kernels in
    # the default PyPI wheels. Lower versions silently fail on RTX 50-series
    # with "no kernel image is available for execution on the device" at the
    # first forward pass.
    "torch>=2.7",
    "transformers",
]

[project.optional-dependencies]
analysis = [
    "umap-learn",
    "scikit-fda",
    "pyarrow",
]
dev = [
    "pytest",
]

[tool.ruff]
# CI lints with a bare `ruff check .` from the repo root, which without this config
# descends into external/biofilm-processing and applies ruff's defaults to the engine's
# code — ignoring the engine's own ruff config (its excludes, its E501 policy, its
# per-file ignores). That produced ~180 findings in code this repo does not own and
# cannot fix here, on top of its own. Exclude the submodule: the engine lints itself in
# its own CI.
extend-exclude = ["external"]

[tool.ruff.lint]
# Pyflakes (F) + pycodestyle (E) only — the same policy the engine settled on. F is the
# part that catches real defects (undefined names, unused imports). E501 is off because
# this codebase's explanatory comments and log strings run long on purpose; reflowing
# them would cost more than it returns. Ruff's default rule set is deliberately not used:
# it flags ~70 stylistic issues here (blind `except Exception`, un-sorted imports,
# unused loop unpacking) that are idiomatic in a GUI worker whose whole job is to never
# die on one bad well.
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
# A bare `pytest` must collect ONLY this repo's suite. Without testpaths it walks the whole
# tree, including external/biofilm-processing, which is wrong twice over:
#   1. The engine's tests are not ours to run — it has its own CI and extra dependencies
#      (mahotas etc.) that this package deliberately does not install.
#   2. It hard-fails collection. The engine ships
#      src/multiWellAnalysis/tests/test_security.py and this repo ships
#      tests/test_security.py; neither directory is a package, so both import as module
#      `test_security` and pytest aborts with "import file mismatch".
# This also keeps local runs identical to CI, which invokes a bare `pytest -v`. Passing an
# explicit `pytest tests/` locally masked (2) until CI caught it.
testpaths = ["tests"]
norecursedirs = ["external", "assets", "build", "dist", "*.egg-info"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
biofilm-embeddings-gui = "biofilm_embeddings.gui.app:run"
biofilm-embeddings-run = "biofilm_embeddings.embeddings.extract_run:main"
