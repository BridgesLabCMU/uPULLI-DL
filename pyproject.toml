[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "biofilm-embeddings"
version = "0.1.0"
description = "biofilm-embeddings: biofilm image processing + DINOv2 ViT embedding extraction with a PySide6 GUI"
authors = [
  { name="Seh Na S. Mellick" }
]
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.10"
dependencies = [
    # Pinned (==) on purpose, not >=: the processing engine is vendored as a git
    # submodule at external/biofilm-processing (tag v1.0.0) and installed editable
    # from there. Pinning prevents silent version-drift in the render, which would
    # reintroduce batch effects in the DINOv2 embeddings. Bump deliberately:
    # advance the submodule to a new tag, then bump this pin in the same commit.
    # v1.0.0 is the paper-locked release; its render is byte-identical to v0.5.0
    # (analysis_main/registration/io_utils/image_metadata unchanged).
    "biofilm-processing==1.0.0",
    "numpy",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "opencv-python",
    "pandas",
    "matplotlib",
    "tifffile",
    "imageio",
    "imageio-ffmpeg",
    "tqdm",
    "PySide6",
    # torch>=2.7 — first stable release with Blackwell sm_120 SASS kernels in
    # the default PyPI wheels. Lower versions silently fail on RTX 50-series
    # with "no kernel image is available for execution on the device" at the
    # first forward pass.
    "torch>=2.7",
    "transformers",
]

[project.optional-dependencies]
analysis = [
    "umap-learn",
    "scikit-fda",
    "pyarrow",
]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
# A bare `pytest` must collect ONLY this repo's suite. Without testpaths it walks the whole
# tree, including external/biofilm-processing, which is wrong twice over:
#   1. The engine's tests are not ours to run — it has its own CI and extra dependencies
#      (mahotas etc.) that this package deliberately does not install.
#   2. It hard-fails collection. The engine ships
#      src/multiWellAnalysis/tests/test_security.py and this repo ships
#      tests/test_security.py; neither directory is a package, so both import as module
#      `test_security` and pytest aborts with "import file mismatch".
# This also keeps local runs identical to CI, which invokes a bare `pytest -v`. Passing an
# explicit `pytest tests/` locally masked (2) until CI caught it.
testpaths = ["tests"]
norecursedirs = ["external", "assets", "build", "dist", "*.egg-info"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
biofilm-embeddings-gui = "biofilm_embeddings.gui.app:run"
biofilm-embeddings-run = "biofilm_embeddings.embeddings.extract_run:main"
